<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Лента — Мои выплаты</title>
  <style>
    :root {
      --green:  #1a7272; --green-l: #e8f5f5; --green-d: #145858;
      --gray-0: #f5f6f8; --gray-1: #e9ebed; --gray-2: #b0b7bf;
      --gray-3: #6b7480; --text: #1a1d23; --white: #ffffff;
      --red: #d63b3b; --radius: 12px; --shadow: 0 2px 12px rgba(0,0,0,.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--gray-0); color: var(--text); min-height: 100vh; }

    /* ── Header ── */
    header {
      background: var(--green); color: #fff; padding: 0 12px;
      height: 52px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 10;
    }
    .logo { font-size: 18px; font-weight: 700; flex-shrink: 0; }
    .header-right { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .user-name { display: none; } /* скрыт на мобиле */

    /* ── Language switcher ── */
    .lang-switcher { display: flex; gap: 3px; }
    .lang-btn {
      border: 1.5px solid rgba(255,255,255,.35);
      background: transparent; color: #fff;
      padding: 3px 7px; border-radius: 6px;
      font-size: 11px; font-weight: 600; cursor: pointer;
      transition: all .15s; line-height: 1.4; white-space: nowrap;
    }
    .lang-btn:hover  { background: rgba(255,255,255,.15); }
    .lang-btn.active { background: rgba(255,255,255,.25); border-color: #fff; }

    #btn-logout {
      background: rgba(255,255,255,.15); border: none; color: #fff;
      padding: 6px 10px; border-radius: 20px; cursor: pointer;
      font-size: 12px; transition: background .2s; white-space: nowrap; flex-shrink: 0;
    }
    #btn-logout:hover { background: rgba(255,255,255,.25); }

    /* ── Колокольчик ── */
    .bell-wrap { position: relative; flex-shrink: 0; }
    #btn-bell {
      background: none; border: none; color: #fff; cursor: pointer;
      font-size: 20px; padding: 4px 6px; line-height: 1;
      position: relative; transition: transform .2s;
    }
    #btn-bell:hover { transform: scale(1.15); }
    .bell-badge {
      position: absolute; top: -2px; right: -2px;
      background: #ff4444; color: #fff; font-size: 10px; font-weight: 700;
      min-width: 16px; height: 16px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 3px; pointer-events: none;
    }
    .bell-badge.hidden { display: none; }

    /* ── Дропдаун уведомлений ── */
    .notif-dropdown {
      position: fixed; top: 52px; right: 8px; left: 8px;
      background: #fff; border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0,0,0,.22); z-index: 100; overflow: hidden;
    }
    .notif-dropdown.hidden { display: none; }
    .notif-header {
      padding: 12px 14px; font-size: 13px; font-weight: 700;
      color: var(--gray-3); border-bottom: 1px solid var(--gray-1);
      display: flex; justify-content: space-between; align-items: center;
    }
    .notif-list { max-height: 60vh; overflow-y: auto; }
    .notif-item {
      padding: 12px 14px; border-bottom: 1px solid var(--gray-1); transition: background .15s;
    }
    .notif-item:last-child { border-bottom: none; }
    .notif-date  { font-size: 11px; color: var(--gray-2); margin-bottom: 3px; }
    .notif-store { font-size: 13px; color: var(--text); margin-bottom: 4px; }
    .notif-amt   { font-size: 16px; font-weight: 700; color: var(--green); }
    .notif-empty { padding: 24px; text-align: center; color: var(--gray-2); font-size: 13px; }

    /* ── Layout ── */
    main { padding: 14px 10px; max-width: 760px; margin: 0 auto; }

    /* ── Auth ── */
    #screen-auth {
      display: flex; align-items: flex-start; justify-content: center;
      min-height: 100vh; padding: 20px 12px;
    }
    .auth-box {
      background: #fff; border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 28px 20px;
      width: 100%; max-width: 420px; margin-top: 20px;
    }
    .auth-logo { font-size: 26px; font-weight: 800; color: var(--green); margin-bottom: 6px; }
    .auth-sub  { font-size: 14px; color: var(--gray-3); margin-bottom: 24px; }

    /* ── Lang switcher on auth ── */
    .auth-lang { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
    .auth-lang .lang-btn { border-color: var(--gray-1); color: var(--gray-3); }
    .auth-lang .lang-btn:hover  { background: var(--gray-0); }
    .auth-lang .lang-btn.active { background: var(--green-l); border-color: var(--green); color: var(--green); }

    label { font-size: 13px; font-weight: 600; color: var(--gray-3); display: block; margin-bottom: 6px; }
    input {
      width: 100%; padding: 13px 14px; border: 1.5px solid var(--gray-1);
      border-radius: 8px; font-size: 16px; /* 16px prevents iOS zoom */
      outline: none; transition: border-color .2s;
    }
    input:focus { border-color: var(--green); }
    .input-group { margin-bottom: 16px; }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:active { background: var(--green-d); }
    .btn-primary:disabled { opacity: .5; cursor: default; }
    .error-msg { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 18px; }

    /* ── Card ── */
    .card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px; }
    .card-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .7px; color: var(--gray-3); margin-bottom: 14px;
    }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 0; margin-bottom: 14px; background: var(--gray-1); border-radius: 10px; padding: 3px; }
    .tab {
      flex: 1; padding: 9px 6px; border-radius: 8px; font-size: 13px; font-weight: 500;
      cursor: pointer; border: none; background: transparent; color: var(--gray-3);
      transition: all .15s; text-align: center; -webkit-tap-highlight-color: transparent;
    }
    .tab.active { background: #fff; color: var(--green); font-weight: 700;
                  box-shadow: 0 1px 4px rgba(0,0,0,.1); }

    /* ── Profile grid ── */
    .profile-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .profile-item label { font-size: 11px; color: var(--gray-2); margin-bottom: 2px; }
    .profile-item .val  { font-size: 14px; font-weight: 500; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-green    { background: var(--green-l); color: var(--green); }
    .badge-gray     { background: var(--gray-1);  color: var(--gray-3); }
    .badge-orange   { background: #fff3e0; color: #e65c00; }
    .warn-banner {
      background: #fff3e0; border-left: 4px solid #e65c00; border-radius: 8px;
      padding: 10px 14px; font-size: 13px; color: #7a3600; margin-bottom: 12px; line-height: 1.5;
    }

    /* ── Summary stats ── */
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-box { background: var(--gray-0); border-radius: 10px; padding: 12px; text-align: center; }
    .stat-val   { font-size: 20px; font-weight: 700; color: var(--green); }
    .stat-label { font-size: 11px; color: var(--gray-3); margin-top: 3px; }

    /* ── Filter row ── */
    .filter-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .filter-row-dates { display: flex; align-items: center; gap: 8px; }
    .filter-row input[type="date"],
    .filter-row input[type="month"] { flex: 1; padding: 10px 10px; font-size: 15px; min-width: 0; }
    .filter-row .btn { width: 100%; padding: 11px 20px; font-size: 14px; }

    /* ── Table ── */
    .shifts-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      background: var(--gray-0); color: var(--gray-3); font-size: 10px;
      font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
      padding: 8px 10px; text-align: left; white-space: nowrap;
    }
    td { padding: 10px 10px; border-bottom: 1px solid var(--gray-1); }
    tr:last-child td { border-bottom: none; }
    .amt { font-weight: 600; color: var(--green); }
    .no-data { text-align: center; padding: 28px 16px; color: var(--gray-2); font-size: 14px; }

    /* ── Spinner ── */
    .spinner {
      width: 22px; height: 22px; border: 3px solid var(--gray-1);
      border-top-color: var(--green); border-radius: 50%;
      animation: spin .7s linear infinite; margin: 28px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bellRing {
      0%,100% { transform: rotate(0); }
      20%     { transform: rotate(15deg); }
      40%     { transform: rotate(-15deg); }
      60%     { transform: rotate(10deg); }
      80%     { transform: rotate(-10deg); }
    }
    .hidden { display: none !important; }

    /* ── Реферальная программа и авансы ── */
    .section-card {
      background: #fff; border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 16px; margin-bottom: 12px;
    }
    .section-card .card-title { margin-bottom: 12px; }
    .ref-badge-paid   { background: #e8f5ed; color: #1a7a3c; }
    .ref-badge-unpaid { background: #fff3e0; color: #e65c00; }
    .ref-badge-other  { background: var(--gray-1); color: var(--gray-3); }
    .adv-total-label { font-size: 13px; color: var(--gray-3); }
    .adv-total-val   { font-size: 20px; font-weight: 700; color: var(--red); }

    /* ── Лента событий ── */
    .feed-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .feed-header, .feed-row {
      display: grid;
      grid-template-columns: 68px 1fr 1fr;
      gap: 6px; align-items: start;
      padding: 10px 10px;
      border-bottom: 1px solid var(--gray-1);
    }
    .feed-header {
      font-size: 10px; color: var(--gray-3); font-weight: 700;
      text-transform: uppercase; letter-spacing: .4px;
      background: var(--gray-0); position: sticky; top: 52px;
    }
    .feed-row-advance { background: #fdf6f0; }
    .feed-row-pending { opacity: .6; }
    .feed-date  { font-size: 12px; color: var(--gray-3); padding-top: 2px; }
    .feed-left  { text-align: left; }
    .feed-right { text-align: right; }
    .feed-period, .feed-comment-col { display: none; }
    .feed-amount-pay { font-size: 16px; font-weight: 700; color: var(--green); }
    .feed-amount-adv { font-size: 16px; font-weight: 700; color: var(--text); }
    .feed-amount-pending { font-size: 14px; color: var(--gray-2); }
    .feed-sub   { font-size: 11px; color: var(--gray-3); margin-top: 2px; line-height: 1.4; }
    .feed-meta  { font-size: 11px; color: var(--gray-3); margin-top: 3px; }

    /* ── Desktop ── */
    @media (min-width: 520px) {
      header { padding: 0 20px; height: 56px; }
      .logo  { font-size: 20px; }
      .lang-btn { padding: 4px 9px; font-size: 12px; }
      .header-right { gap: 10px; }
      .user-name { display: block; font-size: 13px; opacity: .85; }
      #btn-logout { font-size: 13px; padding: 6px 13px; }
      main { padding: 24px 16px; }
      .auth-box { padding: 36px 32px; margin-top: 0; align-self: center; }
      #screen-auth { align-items: center; padding: 24px; }
      .card { padding: 24px; margin-bottom: 16px; }
      .section-card { padding: 20px 24px; margin-bottom: 16px; }
      .tabs { display: flex; gap: 4px; background: transparent; padding: 0; margin-bottom: 20px; }
      .tab { flex: none; padding: 9px 18px; font-size: 14px; background: var(--gray-1); color: var(--gray-3); box-shadow: none; }
      .tab.active { background: var(--green); color: #fff; }
      .profile-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
      .profile-item .val { font-size: 15px; }
      .summary-grid { grid-template-columns: repeat(4,1fr); gap: 12px; }
      .stat-val { font-size: 22px; }
      .filter-row { flex-direction: row; align-items: center; gap: 10px; }
      .filter-row .btn { width: auto; }
      .filter-row input[type="date"],
      .filter-row input[type="month"] { flex: none; width: auto; padding: 8px 12px; font-size: 14px; }
      .notif-dropdown { position: absolute; top: calc(100% + 10px); left: auto; right: 0; width: 320px; }
      th { padding: 10px 12px; font-size: 11px; }
      td { padding: 11px 12px; }
      table { font-size: 14px; }
      /* Feed desktop */
      .feed-header, .feed-row {
        grid-template-columns: 80px 1fr 1fr 100px 1fr;
        padding: 11px 12px; gap: 10px;
      }
      .feed-period, .feed-comment-col { display: block; }
    }
  </style>
</head>
<body>

<!-- ═══ AUTH ═══ -->
<div id="screen-auth">
  <div class="auth-box">
    <div class="auth-logo">Лента</div>
    <p class="auth-sub" data-i18n="auth_sub"></p>

    <!-- Выбор языка на экране входа -->
    <div class="auth-lang">
      <button class="lang-btn" data-lang="ru">🇷🇺 РУС</button>
      <button class="lang-btn" data-lang="tg">🇹🇯 ТОҶ</button>
      <button class="lang-btn" data-lang="uz">🇺🇿 ЎЗБ</button>
      <button class="lang-btn" data-lang="ky">🇰🇬 КЫР</button>
    </div>

    <div class="input-group">
      <label data-i18n="phone_label"></label>
      <input id="inp-phone" type="tel" placeholder="+7 900 000-00-00"/>
    </div>
    <button class="btn btn-primary" id="btn-login" data-i18n="btn_login"></button>
    <div class="error-msg" id="err-login"></div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="screen-app" class="hidden">
  <header>
    <div class="logo">Лента</div>
    <div class="header-right">
      <!-- Языки в шапке -->
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="ru">РУС</button>
        <button class="lang-btn" data-lang="tg">ТОҶ</button>
        <button class="lang-btn" data-lang="uz">ЎЗБ</button>
        <button class="lang-btn" data-lang="ky">КЫР</button>
      </div>
      <span class="user-name" id="header-name"></span>
      <div class="bell-wrap">
        <button id="btn-bell" title="Уведомления">🔔
          <span class="bell-badge hidden" id="bell-badge">0</span>
        </button>
        <div class="notif-dropdown hidden" id="notif-dropdown">
          <div class="notif-header">
            <span data-i18n="notif_title"></span>
            <span id="notif-count-label" style="color:var(--green);font-size:12px"></span>
          </div>
          <div class="notif-list" id="notif-list"></div>
        </div>
      </div>
      <button id="btn-logout" data-i18n="btn_logout"></button>
    </div>
  </header>

  <main>
    <div class="tabs">
      <button class="tab active" data-tab="profile" data-i18n="tab_profile"></button>
      <button class="tab" data-tab="summary" data-i18n="tab_summary"></button>
    </div>

    <!-- ─ Профиль ─ -->
    <div id="tab-profile">
      <div class="card">
        <div class="card-title" data-i18n="profile_title"></div>
        <div class="profile-grid" id="profile-grid"><div class="spinner"></div></div>
      </div>
      <!-- Сводка на профиле -->
      <div class="section-card" id="profile-summary-card" style="display:none">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px">
          <div class="card-title" style="margin:0" data-i18n="profile_month"></div>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="month" id="profile-filter-month" style="padding:6px 10px;font-size:14px;border:1.5px solid var(--gray-1);border-radius:8px;outline:none"/>
            <button class="btn btn-primary" id="btn-profile-summary" style="width:auto;padding:7px 14px;font-size:13px" data-i18n="btn_show"></button>
          </div>
        </div>
        <div id="profile-summary-container"><div class="spinner"></div></div>
      </div>
      <!-- История (лента событий) — ниже сводки за месяц -->
      <div class="section-card">
        <div class="card-title" data-i18n="shifts_title"></div>
        <div class="filter-row">
          <div class="filter-row-dates">
            <input type="date" id="filter-from"/>
            <span style="color:var(--gray-3)">—</span>
            <input type="date" id="filter-to"/>
          </div>
          <button class="btn btn-primary" id="btn-load-shifts" data-i18n="btn_show"></button>
        </div>
        <div id="feed-container">
          <div class="no-data" data-i18n="shifts_hint"></div>
        </div>
      </div>
    </div>

    <!-- ─ АПД — Акция «Приведи друга» ─ -->
    <div id="tab-summary" class="hidden">
      <div class="section-card" id="referrals-card">
        <div class="card-title" data-i18n="tab_summary"></div>
        <div id="referrals-container"><div class="spinner"></div></div>
      </div>
    </div>
  </main>
</div>

let token = localStorage.getItem('lenta_token') || null;
let lang  = localStorage.getItem('lenta_lang')  || 'ru';

// ════════════════════════════════════════════════════════
//  i18n
// ════════════════════════════════════════════════════════
function t(key) { return (I18N[lang] || I18N.ru)[key] || key; }

function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  document.documentElement.lang = lang;
}

function setLang(l) {
  lang = l;
  localStorage.setItem('lenta_lang', l);
  applyLang();
  // Перерисовываем динамический контент если уже загружен
  if (token) {
    renderProfile(window._profileCache);
    if (window._profileSummaryCache) renderProfileSummary(window._profileSummaryCache);
    if (window._feedShiftsCache)  renderFeed(window._feedShiftsCache, window._feedAdvancesCache);
    if (window._referralsCache)   renderReferrals(window._referralsCache);
    if (window._notifCache)       renderNotifications(window._notifCache);
  }
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});

const API_BASE = window.location.hostname === 'danilov11.github.io'
  ? 'https://web-production-5bed4.up.railway.app'
  : '';

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body)  opts.body = JSON.stringify(body);
  const res  = await fetch(API_BASE + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || 'Error');
  return data;
}

document.getElementById('btn-login').addEventListener('click', async () => {
  const phone = document.getElementById('inp-phone').value.trim();
  const errEl = document.getElementById('err-login');
  errEl.textContent = '';
  if (!phone) return;
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  try {
    const res = await api('POST', '/auth/login', { phone });

    localStorage.setItem('lenta_token', token);
    showApp();
    loadProfile();
    loadNotifications();
  } catch(e) {
    errEl.textContent = e.message.includes('404') ? t('err_not_found') : e.message;

});

async function loadProfile() {
  try {
    const emp = await api('GET', '/me');
    window._profileCache = emp;
    renderProfile(emp);
    setBitrixUser(emp);
  } catch(e) {
    if (e.message.includes('401')) { token = null; localStorage.removeItem('lenta_token'); showAuth(); }
    return;
  }
  // Загружаем данные параллельно
  const prevMonth = getPrevMonth();
  document.getElementById('profile-filter-month').value = prevMonth;
  loadProfileSummary(prevMonth);
  loadReferrals();
  loadFeed(); // автозагрузка ленты за прошлый месяц
}

function getPrevMonth() {
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() - 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

async function loadProfileSummary(monthStr) {
  document.getElementById('profile-summary-card').style.display = 'block';
  document.getElementById('profile-summary-container').innerHTML = '<div class="spinner"></div>';
  try {
    const [sumRes, advRes] = await Promise.all([
      api('GET', '/me/summary?month=' + monthStr),
      api('GET', '/me/advances')
    ]);
    window._profileSummaryCache = sumRes;
    window._feedAdvancesCache   = advRes;
    renderProfileSummary(sumRes, advRes);
  } catch(e) { /* тихо */ }
}

function renderProfileSummary(res, advRes) {
  if (!res) return;
  const it  = res['итого'];
  const bal = advRes?.total_balance || window._feedAdvancesCache?.total_balance || 0;
  document.getElementById('profile-summary-container').innerHTML = `
    <div class="summary-grid" style="margin-bottom:${bal > 0 ? '12px' : '0'}">
      <div class="stat-box">
        <div class="stat-val">${it['смен'] || 0}</div>
        <div class="stat-label">${t('stat_shifts')}</div>

      <div class="stat-box">
        <div class="stat-val">${it['часов_всего'] || 0}</div>

      </div>

        <div class="stat-val">${fmt(it['выплата_всего'])} ₽</div>
        <div class="stat-label">${t('stat_payment')}</div>
      </div>
      <div class="stat-box">
        <div class="stat-val">${fmt(it['компенсация_обеда'])} ₽</div>

// Передаём данные сотрудника в Bitrix24 при загрузке профиля
function setBitrixUser(emp) {
  if (!emp) return;
  var setData = function() {
    if (window.BX && window.BX.SiteButton && window.BX.SiteButton.setUserData) {
      BX.SiteButton.setUserData({
        name:  emp.full_name || '',
        phone: emp.phone    || '',
      });
    }
  };
  // Пробуем сразу и через 3 сек (если виджет ещё грузится)
  setData();
  setTimeout(setData, 3000);
}

function openBitrix() {
  // Передаём данные перед открытием
  setBitrixUser(window._profileCache);

  var doClick = function() {
    var el = document.querySelector('.b24-widget-button-block')
          || document.querySelector('.b24-widget-button-inner-container')
          || document.querySelector('.b24-widget-button-wrapper')
          || document.querySelector('[class*="b24-widget-button"]');
    if (el) { el.dispatchEvent(new MouseEvent('click', {bubbles: true, cancelable: true})); return true; }
    return false;
  };
  if (!doClick()) setTimeout(doClick, 1000);
}

//  ЛЕНТА СОБЫТИЙ (смены + авансы)
// ════════════════════════════════════════════════════════
async function loadFeed() {
  const from = document.getElementById('filter-from').value;
  const to   = document.getElementById('filter-to').value;
  const cont = document.getElementById('feed-container');
  cont.innerHTML = '<div class="spinner"></div>';
  try {
    const params = new URLSearchParams();
    if (from) params.append('from_date', from);
    if (to)   params.append('to_date',   to);
    const [shiftsRes, advRes] = await Promise.all([
      api('GET', '/me/shifts?' + params),
      api('GET', '/me/advances')
    ]);
    window._feedShiftsCache   = shiftsRes;
    window._feedAdvancesCache = advRes;
    // Обновляем аванс-баланс на карточке профиля
    if (window._profileSummaryCache) renderProfileSummary(window._profileSummaryCache, advRes);
    renderFeed(shiftsRes, advRes, from, to);
  } catch(e) {
    cont.innerHTML = `<div class="no-data" style="color:var(--red)">${e.message}</div>`;
  }
}

function renderFeed(shiftsRes, advRes, from, to) {
  const cont = document.getElementById('feed-container');
  const events = [];

  // Смены
  for (const s of (shiftsRes?.shifts || [])) {
    const hasPayment = Number(s['выплата']) > 0;
    events.push({
      date: s['shift_date'],
      type: hasPayment ? 'payment' : 'pending',
      amount: s['выплата'],
      store: s['магазин'],
      service: s['услуга'],
      hours: s['часы_оплата'],
      unplanned: s['тип_смены'] === 'Смена без плана',
      no_status: !s['статус_заказчика'] && !s['статус_исполнителя'],
    });
  }

  // Авансы — фильтруем по выбранному диапазону
  const fromTs = from ? new Date(from).getTime() : 0;
  const toTs   = to   ? new Date(to).getTime()   : Infinity;
  for (const a of (advRes?.advances || [])) {
    const aTs = new Date(a['дата']).getTime();
    if (aTs < fromTs || aTs > toTs) continue;
    events.push({
      date: a['дата'],
      type: 'advance',
      amount: a['сумма'],
      balance: a['остаток'],
      period:  a['примечание'] || a['проект'] || '',
      comment: a['комментарий_менеджера'] || '',
    });
  }

  // Сортировка по убыванию даты
  events.sort((a, b) => b.date.localeCompare(a.date));

  const hasUnreg = shiftsRes?.shifts?.some(s => !s['статус_заказчика'] && !s['статус_исполнителя']);
  const warn = hasUnreg ? `<div class="warn-banner">⚠️ ${t('warn_no_shift')}</div>` : '';

  if (!events.length) {
    cont.innerHTML = warn + `<div class="no-data">${t('feed_empty')}</div>`; return;
  }

  const rows = events.map(ev => {
    const d = formatDate(ev.date);
    if (ev.type === 'payment') {
      return `<div class="feed-row">
        <div class="feed-date">${d}</div>
        <div class="feed-left">
          <div class="feed-amount-pay">+${fmt(ev.amount)} ₽</div>
          <div class="feed-sub">${ev.store || ''}${ev.unplanned ? ` <span class="badge badge-orange" style="font-size:10px;vertical-align:middle">${t('badge_unplanned')}</span>` : ''}</div>
        </div>
        <div class="feed-right"></div>
        <div class="feed-period feed-comment-col"></div>
        <div class="feed-comment-col"></div>
      </div>`;
    } else if (ev.type === 'pending') {
      return `<div class="feed-row feed-row-pending">
        <div class="feed-date">${d}</div>
        <div class="feed-left">
          <div class="feed-amount-pending">— ₽</div>
          <div class="feed-sub">${ev.store || ''}${ev.unplanned ? ` <span class="badge badge-orange" style="font-size:10px;vertical-align:middle">${t('badge_unplanned')}</span>` : ''}${ev.no_status ? ' ⚠️' : ''}</div>
        </div>
        <div class="feed-right"></div>
        <div class="feed-period feed-comment-col"></div>
        <div class="feed-comment-col"></div>
      </div>`;
    } else {
      return `<div class="feed-row feed-row-advance">
        <div class="feed-date">${d}</div>
        <div class="feed-left"></div>
        <div class="feed-right">
          <div class="feed-amount-adv">${fmt(ev.amount)} ₽</div>
          ${Number(ev.balance) > 0 ? `<div class="feed-sub" style="color:var(--red)">ост. ${fmt(ev.balance)} ₽</div>` : ''}
        </div>
        <div class="feed-period feed-comment-col">${ev.period}</div>
        <div class="feed-comment-col" style="font-size:12px;color:var(--text)">${ev.comment}</div>
      </div>`;
    }
  }).join('');

  cont.innerHTML = warn + `
    <div class="feed-wrap">
      <div class="feed-header">
        <div class="feed-date">${t('col_date')}</div>
        <div class="feed-left">← ${t('feed_payment')}</div>
        <div class="feed-right">${t('feed_advance')} →</div>
        <div class="feed-period feed-comment-col">${t('feed_period')}</div>
        <div class="feed-comment-col">${t('feed_comment')}</div>
      </div>
      ${rows}
    </div>`;
}

// ════════════════════════════════════════════════════════
//  РЕФЕРАЛЫ
// ════════════════════════════════════════════════════════
async function loadReferrals() {
  try {
    const res = await api('GET', '/me/referrals');
    window._referralsCache = res;
    renderReferrals(res);
  } catch(e) { /* тихо */ }
}

function refStatusBadge(status) {
  if (!status) return `<span class="badge ref-badge-other">—</span>`;
  const s = status.toLowerCase();
  if (s.includes('оплачено') || s.includes('оплатили'))
    return `<span class="badge ref-badge-paid">${status}</span>`;
  if (s.includes('не оплачено') || s.includes('в работе'))
    return `<span class="badge ref-badge-unpaid">${status}</span>`;
  return `<span class="badge ref-badge-other">${status}</span>`;
}

function renderReferrals(res) {
  const cont = document.getElementById('referrals-container');
  if (!res || res.referrals.length === 0) {
    cont.innerHTML = `<div class="no-data">${t('lbl_ref_empty')}</div>`; return;
  }
  const totalPaid = res.referrals
    .filter(r => (r['статус']||'').toLowerCase().includes('оплач'))
    .reduce((s,r) => s + (Number(r['сумма_премии'])||0), 0);

  cont.innerHTML = `
    <div style="font-size:13px;color:var(--gray-3);margin-bottom:14px">
      ${t('lbl_ref_total')}: <b>${res.total}</b>
      &nbsp;·&nbsp; ${t('stat_payment')}: <b class="amt">${fmt(totalPaid)} ₽</b>
    </div>
    <div class="shifts-wrap">
    <table>
      <thead>
        <tr>
          <th>${t('lbl_ref_referred')}</th>
          <th>${t('lbl_ref_period')}</th>
          <th>${t('lbl_ref_amount')}</th>
          <th>${t('lbl_ref_status')}</th>
        </tr>
      </thead>
      <tbody>
        ${res.referrals.map(r => `
          <tr>
            <td style="font-size:13px">${r['приведённый'] || '—'}</td>
            <td style="font-size:12px;color:var(--gray-3)">${r['период'] || (r['месяц'] ? r['месяц']+'.'+r['год'] : '—')}</td>
            <td class="amt">${r['сумма_премии'] ? fmt(r['сумма_премии'])+' ₽' : '—'}</td>
            <td>${refStatusBadge(r['статус'])}</td>
          </tr>`).join('')}
      </tbody>
    </table>
    </div>`;
}

// Устанавливаем диапазон по умолчанию — прошлый месяц
const now = new Date();
const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0');
const prevM = new Date(now.getFullYear(), now.getMonth()-1, 1);
const py = prevM.getFullYear(), pm = String(prevM.getMonth()+1).padStart(2,'0');
const lastDayPrev = new Date(now.getFullYear(), now.getMonth(), 0);
document.getElementById('filter-from').value = `${py}-${pm}-01`;
document.getElementById('filter-to').value   = `${py}-${pm}-${String(lastDayPrev.getDate()).padStart(2,'0')}`;

document.getElementById('btn-load-shifts').addEventListener('click', loadFeed);

// ════════════════════════════════════════════════════════
//  УТИЛИТЫ
// ════════════════════════════════════════════════════════
function shortName(n) {
  if (!n) return '';
  const p = n.trim().split(' ');
  return p[0] + (p[1] ? ' ' + p[1][0] + '.' : '');
}
function formatDate(s) {
  if (!s) return '—';
  return new Date(s + 'T00:00:00').toLocaleDateString('ru', { day:'2-digit', month:'short', year:'numeric' });
}
function fmt(n) { return n ? Number(n).toLocaleString('ru') : '0'; }

// ════════════════════════════════════════════════════════
//  УВЕДОМЛЕНИЯ
// ════════════════════════════════════════════════════════
function renderNotifications(res) {
  if (!res) return;
  const badge    = document.getElementById('bell-badge');
  const list     = document.getElementById('notif-list');
  const countLbl = document.getElementById('notif-count-label');

  if (res.count > 0) {
    badge.textContent = res.count > 99 ? '99+' : res.count;
    badge.classList.remove('hidden');
    document.getElementById('btn-bell').style.animation = 'bellRing .5s ease 2';
  } else {
    badge.classList.add('hidden');
  }

  countLbl.textContent = res.count > 0 ? `${res.count} ${t('notif_new')}` : '';
  if (!res.payments.length) {
    list.innerHTML = `<div class="notif-empty">${t('notif_empty')}</div>`;
  } else {
    list.innerHTML = res.payments.map(p => `
      <div class="notif-item">
        <div class="notif-date">${formatDate(p['shift_date'])}</div>
        <div class="notif-store">${p['магазин'] || '—'}</div>
        <div class="notif-amt">+${fmt(p['выплата'])} ₽
          <span style="font-size:12px;color:var(--gray-2);font-weight:400">
            · ${p['часы'] ?? ''}ч
          </span>
        </div>
      </div>`).join('');
  }
}

async function loadNotifications() {
  try {
    const res = await api('GET', '/me/notifications');
    window._notifCache = res;
    renderNotifications(res);
  } catch(e) { /* тихо игнорируем */ }
}

// Открытие/закрытие дропдауна
document.getElementById('btn-bell').addEventListener('click', async () => {
  const dropdown = document.getElementById('notif-dropdown');
  const isOpen   = !dropdown.classList.contains('hidden');
  dropdown.classList.toggle('hidden');

  if (!isOpen) {
    // Помечаем как прочитанные
    try {
      await api('POST', '/me/notifications/read');
      document.getElementById('bell-badge').classList.add('hidden');
    } catch(e) {}
  }
});

// Закрываем при клике вне
document.addEventListener('click', e => {
  const wrap = document.querySelector('.bell-wrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('notif-dropdown').classList.add('hidden');
  }
});

// ════════════════════════════════════════════════════════
applyLang();
if (token) { showApp(); loadProfile(); loadNotifications(); }
else        { showAuth(); }
